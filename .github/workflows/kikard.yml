name: Kikard Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Connexion kikard (compte CI dédié)
        run: npx --yes kikard@latest login "${{ secrets.KIKARD_CI_API_KEY }}"

      # 1. Génération des rapports d'audit (HTML interactif & JSON)
      - name: Générer les rapports d'audit (HTML & JSON)
        if: always()
        run: |
          npx --yes kikard@latest scan . --html kikard-report.html
          npx --yes kikard@latest scan . --json > kikard-report.json

      # 2. Poster le résumé en commentaire sur la Pull Request
      - name: Poster le résumé kikard sur la PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            if (!fs.existsSync('kikard-report.json')) {
              console.log('Rapport JSON non trouvé.');
              return;
            }

            const rawReport = fs.readFileSync('kikard-report.json', 'utf8');
            let report;
            try {
              report = JSON.parse(rawReport);
            } catch (e) {
              console.log('Erreur de lecture du JSON:', e.message);
              return;
            }

            const findings = report.findings || [];
            const stats = {
              critical: findings.filter(f => f.severity === 'critical').length,
              high: findings.filter(f => f.severity === 'high').length,
              medium: findings.filter(f => f.severity === 'medium').length,
              low: findings.filter(f => f.severity === 'low').length,
              info: findings.filter(f => f.severity === 'info').length
            };

            const statusEmoji = (stats.critical > 0 || stats.high > 0) ? '❌' : (stats.medium > 0 ? '⚠️' : '✅');

            let body = `### ${statusEmoji} Rapport de Sécurité kikard\n\n`;
            body += `| Sévérité | Nombre |\n`;
            body += `| :--- | :--- |\n`;
            body += `| 🚨 **Critique** | **${stats.critical}** |\n`;
            body += `| 🟠 **Élevé** | **${stats.high}** |\n`;
            body += `| 🟡 **Moyen** | **${stats.medium}** |\n`;
            body += `| 🔵 **Faible** | **${stats.low}** |\n`;
            body += `| ⚪ **Info** | **${stats.info}** |\n\n`;

            if (findings.length > 0) {
              body += `<details><summary><b>Détail des vulnérabilités (${findings.length})</b></summary>\n\n`;
              findings.forEach(f => {
                body += `- **[${f.severity.toUpperCase()}]** ${f.title} (📍 \`${f.location}\`)\n`;
              });
              body += `\n</details>\n\n`;
            } else {
              body += `✅ Aucun problème de sécurité détecté.\n\n`;
            }

            body += `👉 *Le rapport HTML complet est disponible dans les artefacts de l'action.*`;

            // Recherche si un commentaire kikard existe déjà pour le mettre à jour
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.body.includes('Rapport de Sécurité kikard'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      # 3. Exécution du scan pour validation CI (échec si faille critique)
      - name: Exécuter le contrôle de sécurité kikard
        run: npx --yes kikard@latest scan . --fail-on critical

      # 4. Publication des rapports d'audit comme artefacts GitHub
      - name: Publier les rapports d'audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kikard-security-reports
          path: |
            kikard-report.html
            kikard-report.json